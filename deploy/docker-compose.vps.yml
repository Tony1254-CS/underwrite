name: underwrite

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: underwrite-web:2026-10-19
    container_name: underwrite-web
    restart: unless-stopped
    command:
      - node
      - web/node_modules/next/dist/bin/next
      - start
      - web
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      CHAIN: base-sepolia
      RPC_URL: https://sepolia.base.org
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3001:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
